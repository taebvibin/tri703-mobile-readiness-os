{week:1,phase:"Base",goal:"Calm pool reps and basic bike consistency.",days:{Monday:[w("Swim 500 yd","Critical","swim","500 yd broken into 25s. Minimum: 300 yd calm 25s."),w("Lift full body","Important","lift","Moderate, no failure.")],Tuesday:[w("BJJ double","Optional","bjj","Technique + controlled rolls. Minimum: one class.")],Wednesday:[w("Bike 45 min","Important","bike","Easy Zone 2. Practice drinking/clipping."),w("BJJ","Optional","bjj","Moderate. Technique only if tired.")],Thursday:[w("Swim 600 yd + run 40 min","Critical","swim","Prioritize swim. Run easy. Minimum: 400 yd swim.")],Friday:[w("Lift or rest","Optional","lift","Rest is acceptable.")],Saturday:[w("Long bike 75–90 min + brick 10 min","Critical","longbike","Most important day. Minimum: 60 min bike.")],Sunday:[w("Run 60 min + easy swim","Important","run","Easy. Swim is optional recovery.")]}},
{week:2,phase:"Base",goal:"Build repeat 25s/50s and ride 90 minutes.",days:{Monday:[w("Swim 600–800 yd","Critical","swim","Mostly 25s, some 50s."),w("Lift full body","Important","lift","Moderate.")],Tuesday:[w("BJJ double","Optional","bjj","Controlled rolling.")],Wednesday:[w("Bike 50–60 min","Important","bike","Easy with 4 x 3 min steady."),w("BJJ","Optional","bjj","Technique emphasis.")],Thursday:[w("Swim 800–1,000 yd + run 45 min","Critical","swim","Try 4–6 x 50 if calm.")],Friday:[w("Lift + optional bike 30 min","Optional","lift","Skip bike if tired.")],Saturday:[w("Long bike 90 min + brick 10–15 min","Critical","longbike","Practice one bottle and light carbs.")],Sunday:[w("Run 65–70 min + swim 600 yd","Important","run","Easy.")]}},
{week:3,phase:"Base",goal:"More 50s; first 100s only if calm.",days:{Monday:[w("Swim 800–1,000 yd","Critical","swim","Try 8 x 50 if ready."),w("Lift full body","Important","lift","Moderate.")],Tuesday:[w("BJJ double","Optional","bjj","No tournament rounds.")],Wednesday:[w("Bike 60 min","Important","bike","Zone 2 with 4 x 5 min steady."),w("BJJ","Optional","bjj","Moderate.")],Thursday:[w("Swim 1,000–1,200 yd + run 45–50 min","Critical","swim","Add 2–4 x 100 only if 50s calm.")],Friday:[w("Lift + optional bike 35 min","Optional","lift","No heavy legs.")],Saturday:[w("Long bike 1 hr 45 + brick 15 min","Critical","longbike","Practice drinking while moving.")],Sunday:[w("Run 70–75 min + swim 800 yd","Important","run","Easy.")]}},

{week:6,phase:"Build",goal:"Increase long bike and swim volume.",days:{Monday:[w("Swim 1,400–1,600 yd","Critical","swim","100s should feel controlled."),w("Lift full body","Important","lift","Maintenance.")],Tuesday:[w("BJJ double","Optional","bjj","No war rounds.")],Wednesday:[w("Bike 70–75 min","Important","bike","Steady intervals or Zone 2."),w("BJJ","Optional","bjj","Technique if shoulders sore.")],Thursday:[w("Swim 1,600–1,800 yd + run 50–55 min","Critical","swim","Build toward 3 x 300.")],Friday:[w("Lift or easy bike 40 min","Optional","lift","Only if fresh.")],Saturday:[w("Long bike 2 hr 30–45 + brick 20 min","Critical","longbike","Fuel: 45–60g/hr.")],Sunday:[w("Run 80–90 min + easy swim","Important","run","Easy.")]}},
{week:7,phase:"Build",goal:"First 3-hour ride. BJJ must stay controlled.",days:{Monday:[w("Swim 1,600–1,800 yd","Critical","swim","Use 300 blocks if ready."),w("Lift full body","Important","lift","Maintenance.")],Tuesday:[w("BJJ double controlled","Optional","bjj","One class if fatigue high.")],Wednesday:[w("Bike 75 min","Important","bike","Zone 2 / light tempo."),w("BJJ","Optional","bjj","Light/moderate.")],Thursday:[w("Swim 1,800–2,000 yd + run 45–55 min","Critical","swim","Could be 3 x 300 or 4 x 300.")],Friday:[w("Lift + optional bike 30 min","Optional","lift","Very light.")],Saturday:[w("Long bike 3 hr + brick 20–25 min","Critical","longbike","Fuel: 60g/hr target.")],Sunday:[w("Run 75–85 min + easy swim","Important","run","Controlled.")]}},
{week:8,phase:"Checkpoint",goal:"Cut back and evaluate swim/bike readiness.",days:{Monday:[w("Swim 1,400–1,600 yd","Critical","swim","Technique reset."),w("Lift full body","Important","lift","Light/moderate.")],Tuesday:[w("BJJ double light","Optional","bjj","Technical only if tired.")],Wednesday:[w("Bike 50–60 min","Important","bike","Easy."),w("BJJ","Optional","bjj","Technique.")],Thursday:[w("Swim 1,500–1,700 yd + run 40–45 min","Critical","swim","Controlled repeats.")],Friday:[w("Lift or rest","Optional","lift","Rest encouraged if beat up.")],Saturday:[w("Long bike 2 hr 15 + brick 15 min","Critical","longbike","Cutback but still fuel.")],Sunday:[w("Run 65–75 min + easy swim","Important","run","Easy.")]}},
{week:9,phase:"Peak",goal:"Race-specific confidence; open water if possible.",days:{Monday:[w("Swim 1,800–2,000 yd","Critical","swim","3 x 500 if ready."),w("Lift light","Optional","lift","Maintenance only.")],Tuesday:[w("BJJ double controlled","Optional","bjj","No death rounds.")],Wednesday:[w("Bike 75 min","Important","bike","Race-effort blocks."),w("BJJ light","Optional","bjj","Technical only.")],Thursday:[w("Swim 2,000–2,300 yd + run 50 min","Critical","swim","Race-distance total is the goal.")],Friday:[w("Lift light or rest","Optional","lift","Rest is fine.")],Saturday:[w("Long bike 3 hr 30 + brick 25–30 min","Critical","longbike","Fuel: 60–75g/hr. Race setup.")],Sunday:[w("Run 90–100 min + easy swim","Important","run","Do not race the run.")]}},

{week:12,phase:"Race Week",goal:"Stay sharp, rested, and calm.",days:{Monday:[w("Swim 1,000–1,200 yd easy","Critical","swim","Smooth only.")],Tuesday:[w("Skip BJJ or technique only","Optional","bjj","Best choice: skip.")],Wednesday:[w("Bike 40–50 min easy","Important","bike","Light spin.")],Thursday:[w("Swim 800–1,000 yd + run 25–35 min","Important","swim","Short and relaxed.")],Friday:[w("Rest","Critical","rest","No new work.")],Saturday:[w("Short shakeout or rest","Important","rest","Check gear.")],Sunday:[w("Race / final prep","Critical","race","Execute calmly.")]}},
];
function w(title,priority,type,desc){return{title,priority,type,desc}}
const SWIM=[["Calm 25s","Repeat 25 yd without panic.","12 x 25 controlled"],["Calm 50s","Repeat 50 yd with controlled breathing.","8 x 50 controlled"],["First 100s","Controlled 100 yd repeats.","4 x 100 controlled"],["300 blocks","Build steady 300 yd blocks.","3 x 300 controlled"],["500 blocks","Race-useful blocks.","3 x 500 controlled"],["Pool race-ready","Pool confidence.","1,500 continuous or 2,000+ total"],["Open-water ready","Race-specific calm.","30–40 min open water calm"]];

const defaultState={tab:"today",startDate:"2026-07-07",raceDate:"2026-09-30",autoSchedule:true,manualWeek:1,day:todayName(),feel:null,limiter:null,bjjPattern:"tuewed",lesson:{enabled:true,day:"Thu",end:"2026-08-23"},life:{},done:{},adjustments:[],equipment:{},swimLevel:1,swimHistory:[],ready:{swim:"red",bike:"red",brick:"red",run:"green",fueling:"red",openwater:"red",bjj:"yellow"},logs:[]};
let state=load();
function load(){try{return{...defaultState,...JSON.parse(localStorage.getItem("tri703mobilev2")||"{}")}}catch{return{...defaultState}}}
function save(){localStorage.setItem("tri703mobilev2",JSON.stringify(state))}
function todayName(){return["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()]}
function $(s){return document.querySelector(s)}
function toast(msg="Saved"){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),900)}
function dateOnly(d){return new Date(d+"T00:00:00")}
function daysSinceStart(){return Math.floor((new Date().setHours(0,0,0,0)-dateOnly(state.startDate).getTime())/86400000)}
function isPreseason(){return state.autoSchedule && daysSinceStart()<0}
function currentWeek(){if(!state.autoSchedule)return state.manualWeek; const ds=daysSinceStart(); if(ds<0)return 1; return Math.min(12,Math.floor(ds/7)+1)}
function currentDay(){if(state.autoSchedule&&!isPreseason())return todayName(); return state.day}
function planWeek(){return PLAN.find(p=>p.week==currentWeek())||PLAN[0]}
function dayWorkouts(){const p=planWeek(),d=currentDay();return p.days[d]||p.days.Monday}
function init(){document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();render()});render(); if("serviceWorker" in navigator){navigator.serviceWorker.register("./service-worker.js").catch(()=>{})}}
function syncShell(){const p=planWeek(); $("#weekSelect").innerHTML=PLAN.map(x=>`<option value="${x.week}" ${x.week==currentWeek()?"selected":""}>W${x.week}</option>`).join(""); $("#weekSelect").disabled=state.autoSchedule; $("#weekSelect").onchange=e=>{state.manualWeek=+e.target.value;save();render()}; document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab)); $("#title").textContent=isPreseason()?"Preseason mode.":"Today first."; $("#subtitle").textContent=isPreseason()?`12-week build starts ${fmt(state.startDate)}. Browse now; tracking is optional.`:"Low-friction plan for swim/bike build + BJJ + lifting."}
function fmt(s){const d=dateOnly(s); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function render(){syncShell(); if(state.tab==="today")renderToday(); if(state.tab==="week")renderWeek(); if(state.tab==="swim")renderSwim(); if(state.tab==="ready")renderReady(); if(state.tab==="adjust")renderAdjust(); if(state.tab==="settings")renderSettings(); save()}
function preseasonCard(){const left=Math.abs(daysSinceStart());return `<section class="card stack"><div><div class="eyebrow">Preseason</div><h2>${left} days until Week 1</h2><p>Use this period to build base without tracking pressure. Week 1 starts ${fmt(state.startDate)}.</p></div><div class="soft"><strong>Preseason priorities:</strong><br>1–2 easy bikes/week, 2–3 swims/week focused on calm breathing, normal BJJ/lifting if you want, and no guilt for vacation gaps.</div><div class="grid two"><button class="btn primary" id="previewWeek1">Preview Week 1</button><button class="btn ghost" id="startNow">Start tracking now</button></div></section>`}
function decision(){if(isPreseason())return["yellow","Preseason: no required tracking. Do easy base work only."]; if(state.feel==="red")return["red","Critical only or rest. Skip optional work."]; if(state.feel==="yellow")return["yellow","Use minimum versions. Keep critical swim/bike if possible."]; if(state.limiter&&state.limiter!=="none")return["yellow",`Limiter: ${state.limiter}. Use minimums for affected sessions.`]; if(state.feel==="green")return["green","Full plan is reasonable."]; return["yellow","Tap Green / Yellow / Red to get an adjusted plan."]}

function daysUntil(dateStr){
  const d=new Date(dateStr+"T00:00:00"); const now=new Date(); now.setHours(0,0,0,0);
  return Math.ceil((d-now)/86400000);
}
function lessonActive(){
  if(!state.lesson?.enabled) return false;
  const today=new Date(); today.setHours(0,0,0,0);
  const end=new Date((state.lesson.end||"2026-08-23")+"T23:59:59");
  return today<=end;
}
function isLessonDay(day=currentDay()){
  return lessonActive() && day===(state.lesson?.day||"Thu");
}
function phaseArt(kind="today"){
  return `<div class="art">${kind==="swim"?swimSvg():kind==="bike"?bikeSvg():kind==="gear"?gearSvg():heroSvg()}</div>`;

function finishConfidence(){
  const a=weeklyAnchorCounts();
  let score=30;
  score += Math.min(state.swimLevel,7)*5;
  score += a.longbike?18:0;
  score += a.brick?10:0;
  score += a.swims>=2?14:a.swims*5;
  score += state.ready?.fuel==="green"?10:state.ready?.fuel==="yellow"?5:0;
  score += state.ready?.open==="green"?12:state.ready?.open==="yellow"?6:0;
  score = Math.max(5, Math.min(95, score));
  const status = score>=75?"Green":score>=50?"Yellow":"Red";
  const reason = status==="Green"?"Core anchors are trending well.":"Swim/open-water/fueling/bike anchors still need protection.";
  return {score,status,reason};
}

}
function lifeSummary(){

  const map={travel:"Vacation/travel",sat:"Saturday unavailable",sun:"Sunday unavailable",pool:"No pool access",bike:"No bike access",misslesson:"Missed swim lesson",bjjmove:"BJJ moved",cooked:"Low sleep/cooked",pain:"Pain/injury"};

function lifeRecommendation(){

  if(l.pain) return "Pain override: only pain-free easy work. No testing pain with hard sessions.";
  if(l.travel) return "Vacation mode: protect movement, not volume. Swim/water if easy, one ride if possible, one easy run. No makeups after.";
  if(l.sat) return "Saturday unavailable: move long bike to Sunday and shorten/skip Sunday run.";

}

function weeklyAnchorCounts(){
  const p=planWeek();

  DAYS.forEach(day=>(p.days[day]||[]).forEach((w,i)=>{
    const k=`w${p.week}-${day}-${i}`, s=state.done[k]?.status;
    if(!s || s==="skipped") return;
    if(w.type==="swim") swims++;

    <section class="card stack"><div><div class="eyebrow">Move / Adjust</div><h2>Protect the anchors</h2><p>Move critical work first. Cut optional work instead of cramming.</p></div>
      ${selected?`<div class="soft"><strong>Selected:</strong> ${selected.title}</div>`:""}
      <div class="field"><label>Why are you adjusting?</label><select id="adjustReason"><option value="social">Social plans</option><option value="tired">Too tired</option><option value="bjj">BJJ moved</option><option value="travel">Travel</option><option value="weather">Weather</option><option value="pain">Injury/pain</option><option value="pool">No pool/bike access</option></select></div>
      <div class="field"><label>What got disrupted?</label><select id="disrupted"><option value="${selected?selected.type:"whole"}">${selected?workoutTypeLabel(selected.type):"Whole day"}</option><option value="longbike">Long bike</option><option value="swim">Swim</option><option value="run">Run</option><option value="bjj">BJJ</option><option value="lift">Lift</option><option value="whole">Whole day</option></select></div>
      <button class="btn primary" id="getMoveRule">Get recommendation</button>
      <div id="moveOut" class="soft"><strong>Rule:</strong> Pick a reason and disrupted workout.</div>
    </section>
    <section class="card stack"><h2>Adjust this week</h2><p class="mini">Temporary changes. Does not rewrite the full plan.</p><div class="grid two">${lifeToggle("travel","Vacation / travel")}${lifeToggle("sat","Saturday unavailable")}${lifeToggle("sun","Sunday unavailable")}${lifeToggle("pool","No pool access")}${lifeToggle("bike","No bike access")}${lifeToggle("misslesson","Missed swim lesson")}${lifeToggle("bjjmove","BJJ moved")}${lifeToggle("cooked","Low sleep / cooked")}${lifeToggle("pain","Pain / injury")}</div><div class="soft"><strong>Adjusted recommendation:</strong> ${lifeRecommendation()}</div></section><section class="card stack"><h2>BJJ this week</h2><p class="mini">Choose the real BJJ pattern and let the week adjust around it.</p>
      <div class="seg two">
        ${bjjBtn("montue","Mon/Tue")}
        ${bjjBtn("tuewed","Tue/Wed")}
        ${bjjBtn("tuedouble","Tue double only")}
        ${bjjBtn("oneday","One day only")}
        ${bjjBtn("skip","Skip BJJ")}
      </div>
      <div class="soft"><strong>Guidance:</strong> ${bjjGuidance()}</div>
    </section>
    <section class="card stack"><h2>Minimum viable week</h2>
      <div class="soft"><strong>Full:</strong> 3 swims, 3 bikes, 2 runs, 2 BJJ days, 2 lifts.</div>
      <div class="soft"><strong>Minimum:</strong> 2 swims, 1 long bike, 1 brick, 1 easy run. BJJ/lift optional.</div>
      <div class="soft"><strong>Travel:</strong> Swim if available, easy runs if convenient, hotel bike optional. No guilt.</div>
    </section>
    <section class="card stack"><h2>Missed workout rules</h2>
      <div class="soft"><strong>Missed swim:</strong> replace optional lift/easy run/easy bike.</div>
      <div class="soft"><strong>Missed long bike:</strong> move once, reduce long run.</div>
      <div class="soft"><strong>Missed run/lift/BJJ:</strong> usually skip, do not make up.</div>
      <div class="soft"><strong>Missed brick:</strong> add 10 min after next bike.</div>
    </section>
  </div>`;
  document.querySelectorAll("[data-life]").forEach(c=>c.onchange=()=>{state.life=state.life||{};state.life[c.dataset.life]=c.checked;save();render()});
  document.querySelectorAll("[data-bjj]").forEach(b=>b.onclick=()=>{state.bjjPattern=b.dataset.bjj;save();render()});
  $("#getMoveRule").onclick=()=>{$("#moveOut").innerHTML=`<strong>Recommendation:</strong> ${moveRecommendation($("#adjustReason").value,$("#disrupted").value)}`;};
}
function lifeToggle(key,label){return `<label class="row soft"><span>${label}</span><input type="checkbox" data-life="${key}" ${state.life&&state.life[key]?"checked":""} style="width:auto;min-height:auto"></label>`}
function bjjBtn(val,label){return `<button class="btn ${state.bjjPattern===val?"primary":"ghost"}" data-bjj="${val}">${label}</button>`}

function renderSettings(){const ds=daysSinceStart();$("#screen").innerHTML=`<div class="stack"><section class="card stack"><div><div class="eyebrow">Schedule</div><h2>${isPreseason()?"Preseason active":`Week ${currentWeek()} active`}</h2><p>${state.autoSchedule?`Auto schedule uses ${fmt(state.startDate)} as Week 1 start.`:"Manual week mode is on."}</p></div><div class="field"><label>Week 1 start date</label><input id="startDate" type="date" value="${state.startDate}"></div><div class="field"><label>Race date</label><input id="raceDate" type="date" value="${state.raceDate}"></div><div class="seg two"><button class="btn ${state.autoSchedule?"primary":"ghost"}" id="autoToggle">${state.autoSchedule?"Auto on":"Auto off"}</button><button class="btn ghost" id="setManual">Manual week</button></div></section><section class="card stack"><h2>Reset</h2><div class="seg two"><button class="btn yellow" id="resetDay">Reset today</button><button class="btn yellow" id="resetWeek2">Reset week</button></div><button class="btn red" id="resetAll">Reset all app data</button></section><section class="card stack"><h2>Export / import progress</h2><p class="mini">Use this to move progress between phone and desktop. Copy from one device, paste into the other.</p><textarea id="exportBox" readonly>${exportText()}</textarea><button class="btn ghost" id="copyExport">Copy export</button><details><summary>Import progress</summary><div class="stack" style="margin-top:12px"><textarea id="importBox" placeholder="Paste export text here"></textarea><button class="btn primary" id="importBtn">Import</button></div></details></section><section class="card stack"><h2>Install note</h2><p class="mini">After updating GitHub, reopen the home-screen app or refresh Safari. If it looks stale, delete and re-add the home-screen icon.</p></section></div>`;$("#startDate").onchange=e=>{state.startDate=e.target.value;save();render()};$("#raceDate").onchange=e=>{state.raceDate=e.target.value;save();render()};$("#autoToggle").onclick=()=>{state.autoSchedule=!state.autoSchedule;save();render()};$("#setManual").onclick=()=>{state.autoSchedule=false;state.manualWeek=currentWeek();save();render()};$("#resetDay").onclick=()=>{Object.keys(state.done).forEach(k=>{if(k.startsWith(`w${currentWeek()}-${currentDay()}-`))delete state.done[k]});save();toast("Today reset");render()};$("#resetWeek2").onclick=()=>{Object.keys(state.done).forEach(k=>{if(k.startsWith(`w${currentWeek()}-`))delete state.done[k]});save();toast("Week reset");render()};$("#resetAll").onclick=()=>{if(confirm("Reset all progress and settings?")){localStorage.removeItem("tri703mobilev2");state=load();toast("Reset");render()}};$("#copyExport").onclick=async()=>{try{await navigator.clipboard.writeText(exportText());toast("Copied")}catch{toast("Copy failed")}};$("#importBtn").onclick=()=>importText($("#importBox").value)}
init();
</script>
</body>
</html>
