<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#111827"/>
<link rel="manifest" href="./manifest.json"/>
<title>70.3 OS Working</title>
<style>
:root{
  --bg:#f7f8fb;--card:#fff;--ink:#111827;--muted:#64748b;--line:#e5e7eb;
  --blue:#2563eb;--green:#16a34a;--yellow:#d97706;--red:#dc2626;
  --softBlue:#eff6ff;--softGreen:#ecfdf5;--softYellow:#fffbeb;--softRed:#fef2f2;
  --shadow:0 18px 42px rgba(15,23,42,.08);--r:22px
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);padding-bottom:92px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:760px;margin:0 auto;padding:16px 14px 24px}.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
h1,h2,h3,p{margin:0}h1{font-size:30px;letter-spacing:-.04em;line-height:.98}h2{font-size:20px;letter-spacing:-.03em}h3{font-size:16px;letter-spacing:-.02em}.mini{font-size:13px;color:var(--muted);line-height:1.35}.muted{color:var(--muted)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:900}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:#f8fafc;font-size:12px;font-weight:850;white-space:nowrap}
.status.green{background:var(--softGreen);color:#166534;border-color:#bbf7d0}.status.yellow{background:var(--softYellow);color:#92400e;border-color:#fde68a}.status.red{background:var(--softRed);color:#991b1b;border-color:#fecaca}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#111827,#1e3a5f 55%,#dbeafe 190%);color:white;border:0}
.hero .mini,.hero .eyebrow{color:rgba(255,255,255,.72)}.hero h1,.hero h2{color:white}
.heroGrid{display:block}.heroArt{display:none}
@media(max-width:620px){.heroGrid{display:block}.heroArt{display:none}.app{padding:12px 10px 24px}h1{font-size:28px}}
.mainMove{padding:18px}.mainMove .move{font-size:25px;font-weight:950;letter-spacing:-.04em;line-height:1.05}
.avoid{background:#fff7ed;border-left:5px solid #f59e0b;color:#7c2d12;border-radius:16px;padding:12px;font-size:13px;line-height:1.35}
.workout{border:1px solid var(--line);border-radius:20px;padding:14px;background:#fff}.workout.done{background:var(--softGreen);border-color:#bbf7d0}
.icon{width:38px;height:38px;border-radius:15px;background:#eef6ff;border:1px solid #dbeafe;display:grid;place-items:center;font-size:20px;flex:0 0 auto}.whead{display:flex;gap:10px;align-items:flex-start}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.btn{border:1px solid var(--line);border-radius:15px;padding:11px 12px;background:#fff;font-weight:900;min-height:44px}.btn.primary{background:#111827;color:white;border-color:#111827}.btn.blue{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}.btn.green{background:#ecfdf5;color:#166534;border-color:#bbf7d0}.btn.yellow{background:#fffbeb;color:#92400e;border-color:#fde68a}.btn.red{background:#fef2f2;color:#991b1b;border-color:#fecaca}.btn.ghost{background:#f8fafc}
details{border:1px solid var(--line);border-radius:16px;background:#f8fafc;padding:11px}summary{cursor:pointer;font-weight:900}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.detailGrid>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.anchor{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}.check{width:28px;height:28px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:#f8fafc;font-weight:950}.check.ok{background:var(--softGreen);color:#166534;border-color:#bbf7d0}
.swimPath{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.node{min-width:118px;border:1px solid var(--line);border-radius:18px;background:#fff;padding:10px}.node.current{background:var(--softBlue);border-color:#bfdbfe}.node.done{background:var(--softGreen);border-color:#bbf7d0}
.lifeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.life{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px;font-size:13px;font-weight:800}.life input{width:auto;min-height:auto}
textarea,input[type="date"],select{width:100%;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff;min-height:44px}.note{min-height:82px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom));z-index:10}.tabs{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tab{border:0;border-radius:16px;padding:10px 6px;background:transparent;font-weight:900;color:var(--muted);font-size:12px}.tab.active{background:#111827;color:white}
.hidden{display:none}.settingsBtn{position:absolute;right:14px;top:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:white;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#111827;color:white;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:850;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1}

.disciplineStrip{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.disciplineChip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}


.targetGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.targetBox{border:1px solid var(--line);border-radius:14px;background:#f8fafc;padding:10px}
.targetBox strong{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
@media(max-width:420px){.targetGrid{grid-template-columns:1fr}}


.adjustBanner{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:18px;padding:12px;font-size:13px;line-height:1.35}
button:disabled{opacity:.45;cursor:not-allowed}

</style>
</head>
<body>
<div class="app"><div id="screen"></div></div>
<div class="tabbar"><div class="tabs">
  <button class="tab active" data-tab="today">Today</button>
  <button class="tab" data-tab="week">Week</button>
  <button class="tab" data-tab="swim">Swim</button>
  <button class="tab" data-tab="adjust">Adjust</button>
</div></div>
<div id="toast" class="toast">Saved</div>
<script>
const STORE="tri703_os_v25_simple";
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const SWIM=[
 ["Calm 25s","8–12 x 25 easy. Rest enough to breathe normally."],
 ["Calm 50s","6–10 x 50 easy. Stop before panic."],
 ["First 100s","4–6 x 100 easy. Smooth breathing only."],
 ["300 blocks","3 x 300 steady. No racing."],
 ["500 blocks","2–3 x 500 steady. Practice calm rhythm."],
 ["Pool ready","1,500–2,000 yd relaxed total."],
 ["Open-water ready","30–40 min calm open-water practice."]
];
const defaultState={
 tab:"today",
 previewWeek:null,
 start:"2026-07-07",
 race:"2026-09-26",
 swimLevel:1,
 lesson:{enabled:true,start:"2026-07-07",end:"2026-08-23"},
 bjj:"tuewed",
 life:{},
 weekAdjust:{},
 done:{},
 notes:{},
 settingsOpen:false
};
let state=load();
function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(STORE)||"{}")}}catch{return {...defaultState}}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function $(q){return document.querySelector(q)}
function todayName(){return DAYS[(new Date().getDay()+6)%7]}
function dateMid(s){return new Date(s+"T00:00:00")}
function daysUntil(s){const n=new Date();n.setHours(0,0,0,0);return Math.ceil((dateMid(s)-n)/86400000)}
function preseason(){return daysUntil(state.start)>0}
function currentWeek(){if(preseason())return 0;const n=new Date();n.setHours(0,0,0,0);return Math.max(1,Math.min(12,Math.floor((n-dateMid(state.start))/604800000)+1))}
function phase(w=currentWeek()){if(w===0)return"Preseason";if(w<=3)return"Base";if(w<=7)return"Build";if(w<=10)return"Peak";return"Taper"}
function weekStartDate(w=currentWeek()){
 if(w===0){const d=dateMid(state.start);d.setDate(d.getDate()-7);return d}
 const d=dateMid(state.start);d.setDate(d.getDate()+(w-1)*7);return d
}
function dateForDay(day,w=currentWeek()){
 const d=weekStartDate(w);d.setDate(d.getDate()+DAYS.indexOf(day));return d
}
function fmtDate(d){return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function fmtDateLong(d){return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function weekRangeLabel(w=currentWeek()){
 const s=weekStartDate(w), e=new Date(s);e.setDate(e.getDate()+6);
 return `${fmtDate(s)} – ${fmtDate(e)}`
}
function activeWeekView(){return state.previewWeek===null||state.previewWeek===undefined?currentWeek():Number(state.previewWeek)}
function sameDate(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function isRaceDate(d){return sameDate(d,dateMid(state.race||"2026-09-26"))}
function isAfterRaceDate(d){const x=new Date(d);x.setHours(0,0,0,0);return x>dateMid(state.race||"2026-09-26")}
function raceDayWorkout(){return [{type:"race",title:"Race Day — 70.3",desc:"Execute. No training workout. Stay calm, fuel early, and keep moving.",priority:"Race"}]}
function postRaceWorkout(){return [{type:"rest",title:"Post-race recovery",desc:"No planned training. Walk, eat, hydrate, sleep, and recover.",priority:"Recovery"}]}
function applyRaceCalendarToPlan(p,w=currentWeek()){
 const out={};DAYS.forEach(day=>{
   const d=dateForDay(day,w);
   if(isRaceDate(d)) out[day]=raceDayWorkout();
   else if(isAfterRaceDate(d)) out[day]=postRaceWorkout();
   else out[day]=p[day]||[];
 });
 return out;
}


function key(day,i,w=currentWeek()){return `w${w}-${day}-${i}`}
function toast(t="Saved"){const el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1100)}
function icon(t){return t==="swim"?"🌊":t==="longbike"||t==="bike"?"🚴":t==="run"?"👟":t==="bjj"?"🥋":t==="lift"?"🏋️":t==="race"?"🏁":t==="rest"?"🛌":"•"}
function lessonActive(){const now=new Date();now.setHours(0,0,0,0);const start=dateMid(state.lesson?.start||state.start||"2026-07-07");const end=new Date((state.lesson?.end||"2026-08-23")+"T23:59:59");return state.lesson?.enabled!==false && now>=start && now<=end}
function isLessonDay(day=todayName()){return lessonActive()&&day==="Thursday"}
function planForWeek(w=currentWeek()){
 if(w===0)return preseasonPlan();
 const long=[75,90,105,90,120,135,150,120,165,180,135,60][w-1]||90;
 const swimYards=[600,800,1000,800,1200,1400,1600,1200,1800,2000,1400,800][w-1]||1000;
 const brick=[10,10,15,10,20,20,25,15,30,30,15,5][w-1]||10;
 return {
  Monday:[{type:"swim",title:`Solo swim ${Math.max(500,swimYards-300)} yd`,desc:"Easy technique. Calm breathing beats distance.",priority:"Important"}],
  Tuesday:[{type:"bjj",title:state.bjj==="tuedouble"?"BJJ double":"BJJ controlled",desc:"Keep it useful. Avoid ego rounds if shoulders/neck feel cooked.",priority:"Optional"}],
  Wednesday:[{type:"bike",title:`Easy bike ${45+Math.min(w,6)*5} min`,desc:"Comfort ride. Practice drinking while moving.",priority:"Important"},{type:"lift",title:"Maintenance lift",desc:"Easy strength. No soreness goal.",priority:"Optional"}],
  Thursday:[{type:"swim",title:isLessonDay("Thursday")?"Swim lesson":"Solo swim technique",desc:isLessonDay("Thursday")?"Thursday evening lesson. Counts as technique anchor. Add one coach note.":"Technique swim. Repeat current level if breathing is messy.",priority:"Critical"}],
  Friday:[{type:"run",title:"Easy run 30–45 min",desc:"Maintain run base. Do not chase pace.",priority:"Optional"}],
  Saturday:[{type:"longbike",title:`Long bike ${Math.floor(long/60)}:${String(long%60).padStart(2,"0")} + ${brick} min brick`,desc:`Primary weekly anchor. Fuel target: ${fuelTarget(w)}.`,priority:"Critical"}],
  Sunday:[{type:"run",title:`Long/easy run ${45+Math.min(w,6)*5} min`,desc:"Flexible. Cut this before cutting long bike or swim.",priority:"Important"}]
 };
}
function preseasonPlan(){
 return {
  Monday:[{type:"swim",title:"Optional easy swim 20–30 min",desc:"Calm breathing. No required yardage.",priority:"Optional"}],
  Tuesday:[{type:"bjj",title:"Normal BJJ",desc:"Train normally but avoid getting wrecked.",priority:"Optional"}],
  Wednesday:[{type:"bike",title:"Optional easy ride 45–60 min",desc:"Bottle practice, clip confidence, comfort.",priority:"Optional"}],
  Thursday:[{type:"swim",title:isLessonDay("Thursday")?"Swim lesson":"Optional swim",desc:isLessonDay("Thursday")?"Fixed lesson through Aug 23. Counts as a win.":"Easy water time only.",priority:"Important"}],
  Friday:[{type:"run",title:"Optional easy run 30 min",desc:"Keep legs moving. No pressure.",priority:"Optional"}],
  Saturday:[{type:"bike",title:"Optional ride 60–90 min",desc:"Comfort and handling. Not a test.",priority:"Optional"}],
  Sunday:[{type:"run",title:"Easy run or rest",desc:"Vacation/social friendly. No guilt.",priority:"Optional"}]
 };
}
function fuelTarget(w){if(w<=2)return"practice drinking; optional 30g/hr";if(w<=4)return"30–45g carbs/hr";if(w<=7)return"45–60g carbs/hr";return"60–90g carbs/hr rehearsal"}
function workoutsToday(){return adjustedPlanForWeek()[todayName()]||[]}
function allWeekWorkouts(){const p=planForWeek();return DAYS.flatMap(d=>(p[d]||[]).map((w,i)=>({day:d,w,i,k:key(d,i)})))}
function weekAnchors(){
 const list=allWeekWorkouts(), done=k=>state.done[k]&&state.done[k]!=="skipped";
 const swim=list.filter(x=>x.w.type==="swim"&&done(x.k)).length;
 const long=list.some(x=>x.w.type==="longbike"&&done(x.k));
 const brick=list.some(x=>x.w.type==="longbike"&&state.notes[x.k]?.brick==="yes");
 return [
  ["Thursday swim lesson", isLessonDay("Thursday")?done(key("Thursday",0)):swim>=1, "Technique anchor through Aug 23"],
  ["Long bike", long || preseason(), preseason()?"Optional until Week 1":"Most important bike durability anchor"],
  ["Solo swim", swim>=2 || preseason(), "Lesson + one solo swim is minimum"],
  ["Brick", brick || preseason(), "Short run off bike"]
 ];
}
function nextMove(){
 const today=new Date();today.setHours(0,0,0,0);if(isRaceDate(today))return["Race day.","Execute the 70.3. No training workouts today.","Going out too hard · underfueling · panic"];if(isAfterRaceDate(today))return["Recover.","No planned training after race day. Walk, eat, hydrate, sleep.","Training through recovery"];
 const ws=workoutsToday();
 if(preseason())return isLessonDay()?["Go to swim lesson.","Show up, practice calm breathing, add one coach note.","Hard shoulder BJJ · guilt tracking"]:["Build comfort, not volume.","Optional swim/bike/run only. No pressure before July 7.","Hero workouts · cramming · guilt tracking"];
 if(isLessonDay())return["Go to Thursday swim lesson.","This is your technique anchor and counts toward swim frequency.","Hard shoulder BJJ · judging by speed"];
 if(ws.some(x=>x.type==="longbike"))return["Protect the long bike.","Bike durability and fueling are the biggest 70.3 limiter after swim.","Hard BJJ · heavy legs · skipping fuel"];
 if(ws.some(x=>x.type==="swim"))return["Get a calm swim done.","Frequency matters more than total yardage right now.","Panic reps · forcing progression"];
 if(ws.some(x=>x.type==="bike"))return["Ride easy and drink while moving.","Bike comfort compounds fast.","Turning it into a test"];
 return["Keep the week intact.","Do the minimum and protect the next anchor.","Cramming missed workouts"];
}
function minFor(w){if(w.type==="longbike")return"60–75% duration + fuel practice";if(w.type==="swim")return"Show up and stay calm; shorten if needed";if(w.type==="bike")return"30–45 min easy";if(w.type==="run")return"20–30 min easy";if(w.type==="bjj")return"Technique only or skip";if(w.type==="lift")return"Skip or one light circuit";if(w.type==="race")return"Start calm and execute the race plan";if(w.type==="rest")return"Walk, hydrate, eat, sleep";return"Short easy version"}
function whyFor(w){if(w.type==="longbike")return"Bike durability/fueling anchor";if(w.type==="swim")return"Build calm technique through frequency";if(w.type==="bike")return"Comfort, handling, bottle practice";if(w.type==="run")return"Maintain your run base";if(w.type==="bjj")return"Keep life normal, but secondary to tri anchors";if(w.type==="lift")return"Maintenance only";if(w.type==="race")return"Race day";if(w.type==="rest")return"Recovery after race";return"Supports week"}
function avoidFor(w){if(w.type==="longbike")return"Hard BJJ, heavy legs, skipping fuel";if(w.type==="swim")return"Panic reps, rushed progression";if(w.type==="bike")return"Hard efforts, poor handling practice";if(w.type==="run")return"Chasing pace";if(w.type==="bjj")return"Ego rounds before key sessions";if(w.type==="lift")return"Soreness or failure sets";if(w.type==="race")return"Going out too hard, underfueling, panic";if(w.type==="rest")return"Training through recovery";return"Cramming"}
function numFromTitle(title){
 const m=String(title).match(/(\d+):(\d+)/);
 if(m)return Number(m[1])*60+Number(m[2]);
 const m2=String(title).match(/(\d+)\s*min/);
 if(m2)return Number(m2[1]);
 return null;
}
function targetFor(w,wk=currentWeek()){
 const mins=numFromTitle(w.title)||numFromTitle(w.desc);
 if(w.type==="longbike"){
   const planned=mins||90;
   const lo=Math.max(8,Math.round(planned/60*12));
   const hi=Math.max(lo+4,Math.round(planned/60*16));
   return {time:`${planned} min`,distance:`~${lo}–${hi} mi`,hr:"Bike Z2: ~125–150, cap ~160",fuel:fuelTarget(wk)};
 }
 if(w.type==="bike"){
   const planned=mins||60;
   const lo=Math.max(6,Math.round(planned/60*12));
   const hi=Math.max(lo+3,Math.round(planned/60*16));
   return {time:`${planned} min`,distance:`~${lo}–${hi} mi`,hr:"Bike Z2: ~125–150",fuel:"Sip often; practice bottle handling"};
 }
 if(w.type==="run"){
   const planned=mins||40;
   const lo=Math.max(2,Math.round(planned/12));
   const hi=Math.max(lo+1,Math.round(planned/9.5));
   return {time:`${planned} min`,distance:`~${lo}–${hi} mi`,hr:"Run easy: ~135–155, cap ~160",fuel:"Usually none unless >75 min"};
 }
 if(w.type==="swim"){
   const yd=String(w.title).match(/(\d{3,4})\s*yd/);
   return {time:"20–45 min",distance:yd?`${yd[1]} yd`:`Level ${state.swimLevel}: ${SWIM[state.swimLevel-1][0]}`,hr:"Effort: calm breathing, not HR",fuel:"None; hydrate after"};
 }
 if(w.type==="bjj")return {time:"1 class or controlled rounds",distance:"—",hr:"Keep intensity controlled",fuel:"Do not let it wreck key swim/bike days"};
 if(w.type==="lift")return {time:"25–45 min",distance:"—",hr:"Easy/moderate",fuel:"No failure sets; no soreness goal"};
 if(w.type==="race")return {time:"Race day",distance:"70.3 miles",hr:"Controlled start; race effort",fuel:"Fuel early and consistently"};
 if(w.type==="rest")return {time:"Recovery",distance:"Optional walk",hr:"Very easy",fuel:"Eat, hydrate, sleep"};
 return {time:"As written",distance:"—",hr:"Easy",fuel:"—"};
}
function targetHtml(w,wk=currentWeek()){
 const t=targetFor(w,wk);
 return `<div class="targetGrid">
   <div class="targetBox"><strong>Time</strong>${t.time}</div>
   <div class="targetBox"><strong>Distance</strong>${t.distance}</div>
   <div class="targetBox"><strong>HR / Effort</strong>${t.hr}</div>
   <div class="targetBox"><strong>Fuel</strong>${t.fuel}</div>
 </div>`;
}

function render(){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));
 if(state.tab==="today")renderToday();
 if(state.tab==="week")renderWeek();
 if(state.tab==="swim")renderSwim();
 if(state.tab==="adjust")renderAdjust();
}
function renderToday(){
 const [move,why,avoid]=nextMove(), ws=workoutsToday(), w=currentWeek();
 $("#screen").innerHTML=`<div class="stack">
  <section class="card hero">
    <button class="settingsBtn" id="settingsBtn">Settings</button>
    <div class="stack">
      <div class="eyebrow">Taejin 70.3 OS</div>
      <h1>${preseason()?"Preseason mode":"Week "+w+" · "+phase(w)}</h1>
      <p class="mini">${preseason()?Math.max(0,daysUntil(state.start))+" days until Week 1":"Today: "+todayName()} · Swim lessons start Week 1</p>
      <div class="disciplineStrip"><span class="disciplineChip">🌊 Swim limiter</span><span class="disciplineChip">🚴 Bike durability</span><span class="disciplineChip">🥋 BJJ-aware</span></div>
    </div>
  </section>
  <section class="card mainMove stack">
    <div class="eyebrow">Next best move</div>
    <div class="move">${move}</div>
    <p class="mini">${why}</p>
    <div class="avoid"><strong>Avoid:</strong> ${avoid}</div>
  </section>
  ${isLessonDay()?lessonCard():""}
  ${activeAdjustmentText()?`<div class="adjustBanner">${activeAdjustmentText()}</div>`:""}<section class="card stack"><div class="row"><h2>Today</h2><span class="pill">${todayName()} · ${fmtDate(new Date())}</span></div>
    ${ws.map((w,i)=>workoutCard(w,i,todayName())).join("")}
  </section>
  ${state.settingsOpen?settingsCard():""}
 </div>`;
 bindCommon(); bindWorkoutButtons(); const s=$("#settingsBtn"); if(s)s.onclick=()=>{state.settingsOpen=!state.settingsOpen;save();render()};
 const note=$("#lessonNote"); if(note)note.oninput=()=>{state.notes.lesson=note.value;save()};
}
function lessonCard(){return `<section class="card stack"><div class="row"><div><h2>🌊 Swim lesson</h2><p class="mini">Fixed Thursday technique anchor from Week 1 through Aug 23.</p></div><span class="pill status green">anchor</span></div><textarea class="note" id="lessonNote" placeholder="Coach note: what did they correct?">${state.notes.lesson||""}</textarea></section>`}
function workoutCard(w,i,day,wk=currentWeek()){
 const k=key(day,i,wk), status=state.done[k], done=status==="done";
 return `<div class="workout ${done?"done":""}">
  <div class="row"><div class="whead"><span class="icon">${icon(w.type)}</span><div><span class="pill">${w.priority}</span><h3>${w.title}</h3><p class="mini">${w.desc}</p></div></div><span class="pill ${done?"status green":""}">${status||"not started"}</span></div>${targetHtml(w,wk)}
  <details><summary>Open workout details</summary><div class="detailGrid"><div><strong>Minimum</strong><br><span class="mini">${minFor(w)}</span></div><div><strong>Why</strong><br><span class="mini">${whyFor(w)}</span></div></div><div class="avoid" style="margin-top:10px"><strong>Avoid:</strong> ${avoidFor(w)}</div></details>
  <div class="actions" style="margin-top:10px"><button class="btn green" data-done="${k}" data-status="done">Done</button><button class="btn yellow" data-done="${k}" data-status="partial">Partial</button><button class="btn red" data-done="${k}" data-status="skipped">Skip</button></div>
  ${w.type==="longbike"&&status?`<div class="actions" style="margin-top:8px"><button class="btn ${state.notes[k]?.brick==="yes"?"primary":"ghost"}" data-brick="${k}" data-val="yes">Brick done</button><button class="btn ${state.notes[k]?.fuel==="good"?"primary":"ghost"}" data-fuel="${k}" data-val="good">Fuel good</button><button class="btn ${state.notes[k]?.fuel==="bad"?"red":"ghost"}" data-fuel="${k}" data-val="bad">Fuel bad</button></div>`:""}
 </div>`
}
function renderWeek(){
 const vw=activeWeekView(), anchors=weekAnchorsFor(vw), p=adjustedPlanForWeek(vw);
 $("#screen").innerHTML=`<div class="stack"><section class="card hero"><div class="stack"><div class="eyebrow">Week view</div><h1>${vw===0?"Preseason":"Week "+vw+" · "+phase(vw)}</h1><p class="mini">${weekRangeLabel(vw)} · ${vw===currentWeek()?"current week":"preview"}</p></div></section>
 <section class="card stack"><div class="row"><div><h2>Preview week</h2><p class="mini">Use this to look ahead without changing today.</p></div><button class="btn ghost" id="jumpCurrent">Current</button></div><select id="weekSelect"><option value="0">Preseason</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}">Week ${i+1} · ${phase(i+1)} · ${weekRangeLabel(i+1)}</option>`).join("")}</select></section>
 ${activeAdjustmentText(vw)?`<div class="adjustBanner">${activeAdjustmentText(vw)}</div>`:""}<section class="card stack"><h2>Anchors</h2>${anchors.map(a=>`<div class="anchor"><span class="check ${a[1]?"ok":""}">${a[1]?"✓":"□"}</span><div><strong>${a[0]}</strong><p class="mini">${a[2]}</p></div></div>`).join("")}</section>
 <section class="card stack"><h2>Plan</h2>${DAYS.map(d=>`<details ${d===todayName()&&vw===currentWeek()?"open":""}><summary>${d} · ${fmtDate(dateForDay(d,vw))}</summary><div class="stack" style="margin-top:10px">${(p[d]||[]).map((w,i)=>workoutCard(w,i,d,vw)).join("")}</div></details>`).join("")}</section></div>`;
 $("#weekSelect").value=String(vw);
 $("#weekSelect").onchange=()=>{state.previewWeek=Number($("#weekSelect").value);save();render()};
 $("#jumpCurrent").onclick=()=>{state.previewWeek=null;save();render()};
 bindWorkoutButtons();
} 
function weekAnchorsFor(w=currentWeek()){
 const list=allWeekWorkoutsFor(w), done=k=>state.done[k]&&state.done[k]!=="skipped";
 const swim=list.filter(x=>x.w.type==="swim"&&done(x.k)).length;
 const long=list.some(x=>x.w.type==="longbike"&&done(x.k));
 const brick=list.some(x=>x.w.type==="longbike"&&state.notes[x.k]?.brick==="yes");
 return [
  ["Thursday swim lesson", w>=1&&w<=7 ? done(key("Thursday",0,w)) : w===0, w===0?"Starts Week 1":"Technique anchor through Aug 23"],
  ["Long bike", long || w===0, w===0?"Optional until Week 1":"Most important bike durability anchor"],
  ["Solo swim", swim>=2 || w===0, "Lesson + one solo swim is minimum"],
  ["Brick", brick || w===0, "Short run off bike"]
 ];
}
function allWeekWorkoutsFor(w=currentWeek()){
 const p=adjustedPlanForWeek(w);return DAYS.flatMap(d=>(p[d]||[]).map((workout,i)=>({day:d,w:workout,i,k:key(d,i,w)})))
}
function renderSwim(){
 const [name,set]=SWIM[state.swimLevel-1];
 $("#screen").innerHTML=`<div class="stack"><section class="card hero"><div class="stack"><div class="eyebrow">Swim limiter</div><h1>Level ${state.swimLevel}: ${name}</h1><p class="mini">Lesson + solo reps. Progress only when calm.</p></div></section>
 <section class="card stack"><h2>Progress path</h2><div class="swimPath">${SWIM.map((s,i)=>`<div class="node ${i+1===state.swimLevel?"current":i+1<state.swimLevel?"done":""}"><strong>Lv ${i+1}</strong><p class="mini">${s[0]}</p></div>`).join("")}</div></section>
 <section class="card stack"><h2>Next solo swim</h2><p>${set}</p><div class="avoid"><strong>Rule:</strong> If breathing gets messy, repeat this level. Do not force distance.</div>
 <div class="actions"><button class="btn green" id="levelUp">Controlled</button><button class="btn yellow" id="repeatLevel">Repeat</button><button class="btn red" id="levelDown">Too hard</button></div></section>
 <section class="card stack"><h2>Lesson note</h2><textarea class="note" id="lessonNote" placeholder="Coach note from Thursday">${state.notes.lesson||""}</textarea></section></div>`;
 $("#levelUp").onclick=()=>{state.swimLevel=Math.min(7,state.swimLevel+1);save();toast("Swim level updated");render()};
 $("#repeatLevel").onclick=()=>toast("Repeat current level");
 $("#levelDown").onclick=()=>{state.swimLevel=Math.max(1,state.swimLevel-1);save();toast("Reduced one level");render()};
 $("#lessonNote").oninput=()=>{state.notes.lesson=$("#lessonNote").value;save()};
}
function renderAdjust(){
 $("#screen").innerHTML=`<div class="stack"><section class="card hero"><div class="stack"><div class="eyebrow">Adjust</div><h1>Life happens</h1><p class="mini">Temporary changes. This does not rewrite the plan.</p></div></section>
 <section class="card stack"><h2>What changed?</h2><div class="lifeGrid">
  ${lifeToggle("travel","Vacation / travel")}${lifeToggle("sat","Saturday unavailable")}${lifeToggle("sun","Sunday unavailable")}${lifeToggle("pool","No pool access")}${lifeToggle("bike","No bike access")}${lifeToggle("misslesson","Missed swim lesson")}${lifeToggle("bjjmove","BJJ moved")}${lifeToggle("cooked","Low sleep / cooked")}${lifeToggle("pain","Pain / injury")}
 </div></section>
 <section class="card stack"><h2>Recommendation</h2><p>${adjustRecommendation()}</p><div class="avoid"><strong>Cut first:</strong> lift · extra run · second BJJ · easy bike. Protect lesson/swim, long bike, brick.</div>${activeAdjustmentText()?`<div class="adjustBanner">${activeAdjustmentText()}</div>`:""}<div class="actions" style="margin-top:10px"><button class="btn primary" id="applyAdjust" ${canApplyAdjustment()?"":"disabled"}>Apply simple adjustment</button><button class="btn ghost" id="clearAdjust">Undo / clear</button></div><p class="mini">Only applies obvious cases: Saturday unavailable, Sunday unavailable, missed swim lesson, or no pool access. Undo restores the normal week.</p></section>
 <section class="card stack"><h2>BJJ pattern</h2><select id="bjj"><option value="tuewed">Tue/Wed</option><option value="tuedouble">Tuesday double only</option><option value="montue">Mon/Tue</option><option value="oneday">One day only</option><option value="skip">Skip BJJ</option></select><p class="mini">${bjjGuidance()}</p></section>
 <section class="card stack"><h2>Data</h2><button class="btn ghost" id="export">Export backup</button><label class="btn ghost" style="display:block;text-align:center">Import backup<input id="import" type="file" accept="application/json" class="hidden"></label><button class="btn red" id="resetToday">Reset today</button></section></div>`;
 document.querySelectorAll("[data-life]").forEach(c=>c.onchange=()=>{state.life[c.dataset.life]=c.checked;save();render()});
 $("#bjj").value=state.bjj; $("#bjj").onchange=()=>{state.bjj=$("#bjj").value;save();render()};
 $("#applyAdjust").onclick=applySimpleAdjustment; $("#clearAdjust").onclick=clearWeekAdjustment; $("#export").onclick=exportData; $("#import").onchange=importData; $("#resetToday").onclick=()=>{workoutsToday().forEach((_,i)=>delete state.done[key(todayName(),i)]);save();toast("Today reset");render()};
}
function lifeToggle(k,label){return `<label class="life"><span>${label}</span><input type="checkbox" data-life="${k}" ${state.life[k]?"checked":""}></label>`}

function activeAdjustmentText(w=currentWeek()){
 const a=state.weekAdjust?.[w];
 if(!a||!a.type)return "";
 if(a.type==="sat")return "Applied: Saturday unavailable. Long bike moved to Sunday; Sunday run cut.";
 if(a.type==="sun")return "Applied: Sunday unavailable. Sunday run cut; Saturday long bike protected.";
 if(a.type==="misslesson")return "Applied: missed lesson. Add one easy solo swim within 48 hours if possible.";
 if(a.type==="pool")return "Applied: no pool access. Swim is blocked; next available swim becomes priority.";
 return "";
}
function canApplyAdjustment(){
 const l=state.life||{};
 return !!(l.sat||l.sun||l.misslesson||l.pool);
}
function simpleAdjustmentType(){
 const l=state.life||{};
 if(l.sat)return"sat";
 if(l.sun)return"sun";
 if(l.misslesson)return"misslesson";
 if(l.pool)return"pool";
 return null;
}
function applySimpleAdjustment(){
 const type=simpleAdjustmentType(), w=currentWeek();
 if(!type){toast("No simple adjustment");return}
 state.weekAdjust=state.weekAdjust||{};
 state.weekAdjust[w]={type,appliedAt:new Date().toISOString()};
 save();toast("Adjustment applied");render();
}
function clearWeekAdjustment(){
 const w=currentWeek();
 if(state.weekAdjust)delete state.weekAdjust[w];
 save();toast("Adjustment cleared");render();
}
function adjustedPlanForWeek(w=currentWeek()){
 const p=planForWeek(w), a=state.weekAdjust?.[w];
 if(!a||!a.type)return applyRaceCalendarToPlan(p,w);
 const clone={};DAYS.forEach(d=>clone[d]=[...(p[d]||[])].map(x=>({...x})));
 if(a.type==="sat"){
   const long=(clone.Saturday||[]).find(x=>x.type==="longbike");
   clone.Saturday=(clone.Saturday||[]).filter(x=>x.type!=="longbike");
   clone.Saturday.unshift({type:"bike",title:"Saturday unavailable",desc:"Long bike moved to Sunday. No makeup needed today.",priority:"Optional"});
   if(long){
     long.desc=long.desc+" Moved from Saturday because Saturday is unavailable.";
     clone.Sunday=[long,{type:"run",title:"Optional short easy run 15–25 min",desc:"Only if legs feel good after moved long bike. Skipping is fine.",priority:"Optional"}];
   }
 }
 if(a.type==="sun"){
   clone.Sunday=[{type:"run",title:"Sunday unavailable / run cut",desc:"No makeup needed. Protect Saturday long bike.",priority:"Optional"}];
 }
 if(a.type==="misslesson"){
   clone.Thursday=(clone.Thursday||[]).map(x=>x.type==="swim"?{...x,title:"Missed swim lesson",desc:"If possible, replace with one easy solo swim within 48 hours. If not, resume next week.",priority:"Important"}:x);
   clone.Friday=[{type:"swim",title:"Replacement solo swim 20–30 min",desc:"Easy technique only. Do not double-stack hard swims.",priority:"Important"},...(clone.Friday||[])];
 }
 if(a.type==="pool"){
   DAYS.forEach(d=>clone[d]=(clone[d]||[]).map(x=>x.type==="swim"?{...x,title:"Pool blocked / swim deferred",desc:"No pool access. Resume swim next available day; do not cram.",priority:"Important"}:x));
 }
 return applyRaceCalendarToPlan(clone,w);
}

function adjustRecommendation(){
 const l=state.life;
 if(l.pain)return"Pain override: only pain-free easy work. Skip BJJ hard rounds and do not test the injury.";
 if(l.travel)return"Vacation mode: movement over volume. Swim/water if easy, one ride if possible, one easy run. No makeups after.";
 if(l.sat)return"Move long bike to Sunday. Shorten or skip Sunday run. Do not replace long bike with a long run.";
 if(l.sun)return"Protect Saturday long bike. Cut Sunday run first.";
 if(l.pool||l.misslesson)return"Replace missed lesson/pool time with one easy solo swim within 48 hours if possible. If not, resume next week.";
 if(l.bike)return"No bike access: swim becomes priority. Run easy, but do not compensate with extra run volume.";
 if(l.bjjmove)return"Keep moved BJJ technical if near a key swim/bike day.";
 if(l.cooked)return"Minimums only: lesson/swim, long bike if safe, one easy run. Skip lift and optional BJJ.";
 return"No override active. Follow Today and protect weekly anchors.";
}
function bjjGuidance(){if(state.bjj==="tuedouble")return"Good spacing. Wednesday can be bike-focused.";if(state.bjj==="montue")return"Watch shoulder fatigue before Thursday lesson.";if(state.bjj==="oneday")return"Fine during heavier tri weeks.";if(state.bjj==="skip")return"Useful during peak/taper or if pain appears.";return"Default good fit. Keep intensity controlled as bike volume rises."}
function bindWorkoutButtons(){
 document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{state.done[b.dataset.done]=b.dataset.status;save();toast();render()});
 document.querySelectorAll("[data-brick]").forEach(b=>b.onclick=()=>{state.notes[b.dataset.brick]=state.notes[b.dataset.brick]||{};state.notes[b.dataset.brick].brick=b.dataset.val;save();toast("Brick noted");render()});
 document.querySelectorAll("[data-fuel]").forEach(b=>b.onclick=()=>{state.notes[b.dataset.fuel]=state.notes[b.dataset.fuel]||{};state.notes[b.dataset.fuel].fuel=b.dataset.val;save();toast("Fuel noted");render()});
}
function bindCommon(){}
function settingsCard(){return `<section class="card stack"><h2>Settings</h2><div><label class="mini">Week 1 start</label><input type="date" id="start" value="${state.start}"></div><div><label class="mini">Race/build date</label><input type="date" id="race" value="${state.race}"></div><label class="life"><span>Swim lessons start Week 1</span><input type="checkbox" id="lessonOn" ${state.lesson.enabled!==false?"checked":""}></label><p class="mini"><strong>Privacy:</strong> all data is local to this phone/browser unless you export it.</p><button class="btn red" id="resetAll">Reset all data</button></section>`}
function heroSvg(){return `<svg viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 130 C70 84 120 94 169 62 C214 33 262 41 306 18" stroke="rgba(255,255,255,.42)" stroke-width="9" stroke-linecap="round"/><path d="M20 148 C78 118 130 130 183 96 C231 65 267 72 304 50" stroke="rgba(147,197,253,.75)" stroke-width="5" stroke-linecap="round"/><circle cx="86" cy="88" r="18" fill="rgba(255,255,255,.82)"/><circle cx="228" cy="50" r="23" fill="rgba(251,191,36,.86)"/><path d="M184 132 c26-23 50-23 76 0" stroke="rgba(255,255,255,.75)" stroke-width="6" stroke-linecap="round"/><circle cx="206" cy="130" r="14" stroke="rgba(255,255,255,.86)" stroke-width="5"/><circle cx="258" cy="130" r="14" stroke="rgba(255,255,255,.86)" stroke-width="5"/><path d="M220 116 h22 l12 14 M231 116 l-12 14" stroke="rgba(255,255,255,.86)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function swimSvg(){return `<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="320" height="160" rx="26" fill="#eff6ff"/><path d="M20 100 C50 74 78 126 108 100 C138 74 166 126 196 100 C226 74 254 126 284 100" stroke="#60a5fa" stroke-width="10" stroke-linecap="round"/><path d="M34 70 h252" stroke="#bfdbfe" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 18"/><circle cx="96" cy="54" r="18" fill="#2563eb"/><path d="M128 58 c36-22 67-21 104 2" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/></svg>`}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tri703-os-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state={...defaultState,...JSON.parse(r.result)};save();toast("Imported");render()}catch{toast("Import failed")}};r.readAsText(f)}
document.addEventListener("change",e=>{if(e.target.id==="start"){state.start=e.target.value;save();render()}if(e.target.id==="race"){state.race=e.target.value;save();render()}if(e.target.id==="lessonOn"){state.lesson.enabled=e.target.checked;save();render()}});
document.addEventListener("click",e=>{if(e.target.id==="resetAll"&&confirm("Reset all local app data?")){state={...defaultState};save();render()}});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();render()});
if("serviceWorker" in navigator){navigator.serviceWorker.register("./service-worker.js").catch(()=>{})}
render();
</script>
</body>
</html>
