<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>70.3 Mobile Readiness OS</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --soft: #f1f5f9;
      --dark: #111827;
      --green: #16a34a;
      --yellow: #ca8a04;
      --red: #dc2626;
      --blue: #2563eb;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      --radius: 20px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { padding-bottom: calc(82px + env(safe-area-inset-bottom)); }
    button, select, input, textarea { font: inherit; }
    .app { max-width: 980px; margin: 0 auto; padding: 16px; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .eyebrow { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 3px 0 0; font-size: clamp(28px, 8vw, 44px); letter-spacing: -0.05em; line-height: .95; }
    h2 { margin: 0; font-size: 22px; letter-spacing: -0.03em; }
    h3 { margin: 0; font-size: 16px; letter-spacing: -0.01em; }
    p { margin: 0; color: var(--muted); line-height: 1.45; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .grid { display: grid; gap: 12px; }
    .grid.two { grid-template-columns: 1fr 1fr; }
    .muted { color: var(--muted); }
    .btn { border: 1px solid var(--border); background: white; border-radius: 16px; padding: 12px 14px; min-height: 46px; color: var(--text); cursor: pointer; font-weight: 800; }
    .btn:active { transform: scale(.99); }
    .btn.primary { background: var(--dark); color: white; border-color: var(--dark); }
    .btn.ghost { background: var(--soft); border-color: transparent; }
    .btn.small { min-height: 36px; padding: 8px 11px; border-radius: 12px; font-size: 13px; }
    .btn.green { background: #dcfce7; border-color: #bbf7d0; color: #14532d; }
    .btn.yellow { background: #fef3c7; border-color: #fde68a; color: #713f12; }
    .btn.red { background: #fee2e2; border-color: #fecaca; color: #7f1d1d; }
    .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 9px; font-size: 12px; font-weight: 900; background: var(--soft); color: var(--text); white-space: nowrap; }
    .pill.critical { background: #fee2e2; color: #991b1b; }
    .pill.important { background: #fef3c7; color: #92400e; }
    .pill.optional { background: #dbeafe; color: #1e40af; }
    .status { color: white; }
    .status.green { background: var(--green); }
    .status.yellow { background: var(--yellow); }
    .status.red { background: var(--red); }
    .soft { background: var(--soft); border-radius: 16px; padding: 12px; }
    .workout { border: 1px solid var(--border); border-radius: 18px; padding: 14px; background: white; }
    .workout.done { opacity: .66; background: #f8fafc; }
    .workout.done .wtitle { text-decoration: line-through; }
    .wtitle { font-size: 17px; font-weight: 900; margin: 8px 0 4px; }
    .detail { color: var(--muted); font-size: 14px; }
    .hidden { display: none !important; }
    .seg { display: grid; gap: 8px; grid-template-columns: repeat(3, 1fr); }
    .seg.two { grid-template-columns: repeat(2, 1fr); }
    .seg.four { grid-template-columns: repeat(4, 1fr); }
    .choice.active { outline: 2px solid var(--dark); border-color: var(--dark); }
    select, input, textarea { width: 100%; border: 1px solid var(--border); border-radius: 14px; padding: 12px; background: white; color: var(--text); min-height: 44px; }
    label { font-size: 13px; font-weight: 800; color: var(--muted); }
    .field { display: grid; gap: 6px; }
    .mini { font-size: 13px; }
    .nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.92); border-top: 1px solid var(--border); backdrop-filter: blur(14px); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); display: flex; justify-content: center; z-index: 20; }
    .navinner { width: min(980px, 100%); display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .tab { border: 0; background: transparent; color: var(--muted); border-radius: 14px; padding: 9px 4px; font-weight: 900; font-size: 13px; }
    .tab.active { background: var(--dark); color: white; }
    .meter { height: 10px; background: var(--soft); border-radius: 999px; overflow: hidden; }
    .meter div { height: 100%; background: var(--dark); border-radius: 999px; }
    .level { border: 1px solid var(--border); border-radius: 16px; padding: 14px; background: white; }
    .level.current { border-color: var(--dark); box-shadow: inset 0 0 0 1px var(--dark); }
    .table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .table th, .table td { text-align: left; border-bottom: 1px solid var(--border); padding: 10px 4px; vertical-align: top; }
    .table th { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--dark); color: white; padding: 10px 14px; border-radius: 999px; font-weight: 800; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
    details { border: 1px solid var(--border); border-radius: 16px; padding: 12px; background: white; }
    summary { cursor: pointer; font-weight: 900; }
    @media (min-width: 760px) {
      .desktop-two { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; }
      body { padding-bottom: 90px; }
    }
    @media (max-width: 520px) {
      .app { padding: 12px; }
      .grid.two, .seg.four { grid-template-columns: 1fr 1fr; }
      .top { align-items: stretch; }
      .weekbox { min-width: 104px; }
      .btn { padding-left: 10px; padding-right: 10px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div>
        <div class="eyebrow">70.3 Readiness OS</div>
        <h1>Today first.</h1>
        <p class="mini">Low-friction plan for swim/bike build + BJJ + lifting.</p>
      </div>
      <div class="card weekbox" style="box-shadow:none;padding:10px;min-width:118px;">
        <label>Week</label>
        <select id="weekSelect"></select>
      </div>
    </div>

    <main id="screen"></main>
  </div>

  <div class="nav">
    <div class="navinner">
      <button class="tab active" data-tab="today">Today</button>
      <button class="tab" data-tab="week">Week</button>
      <button class="tab" data-tab="swim">Swim</button>
      <button class="tab" data-tab="ready">Ready</button>
    </div>
  </div>
  <div id="toast" class="toast">Saved</div>

<script>
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const PLAN = [
  {week:1, phase:"Base", goal:"Calm pool reps and basic bike consistency.", days:{
    Monday:[w("Swim 500 yd","Critical","swim","500 yd broken into 25s. Minimum: 300 yd calm 25s."), w("Lift full body","Important","lift","Moderate, no failure. Minimum: 20 min.")],
    Tuesday:[w("BJJ double","Optional","bjj","Technique + controlled rolls. Minimum: one class.")],
    Wednesday:[w("Bike 45 min","Important","bike","Easy Zone 2. Practice drinking/clipping. Minimum: 25 min."), w("BJJ","Optional","bjj","Moderate. Technique only if tired.")],
    Thursday:[w("Swim 600 yd + run 40 min","Critical","swim","Prioritize swim. Run easy. Minimum: 400 yd swim.")],
    Friday:[w("Lift or rest","Optional","lift","Rest is acceptable.")],
    Saturday:[w("Long bike 75–90 min + brick 10 min","Critical","longbike","Most important day. Minimum: 60 min bike.")],
    Sunday:[w("Run 60 min + easy swim","Important","run","Easy. Swim is optional recovery.")]
  }},
  {week:2, phase:"Base", goal:"Build repeat 25s/50s and ride 90 minutes.", days:{
    Monday:[w("Swim 600–800 yd","Critical","swim","Mostly 25s, some 50s. Minimum: 400 yd."), w("Lift full body","Important","lift","Moderate.")],
    Tuesday:[w("BJJ double","Optional","bjj","Controlled rolling.")],
    Wednesday:[w("Bike 50–60 min","Important","bike","Easy with 4 x 3 min steady."), w("BJJ","Optional","bjj","Technique emphasis.")],
    Thursday:[w("Swim 800–1,000 yd + run 45 min","Critical","swim","Try 4–6 x 50 if calm. Minimum: 500 yd swim.")],
    Friday:[w("Lift + optional bike 30 min","Optional","lift","Skip bike if tired.")],
    Saturday:[w("Long bike 90 min + brick 10–15 min","Critical","longbike","Practice one bottle and light carbs.")],
    Sunday:[w("Run 65–70 min + swim 600 yd","Important","run","Easy.")]
  }},
  {week:3, phase:"Base", goal:"More 50s; first 100s only if calm.", days:{
    Monday:[w("Swim 800–1,000 yd","Critical","swim","Try 8 x 50 if ready."), w("Lift full body","Important","lift","Moderate.")],
    Tuesday:[w("BJJ double","Optional","bjj","No tournament rounds.")],
    Wednesday:[w("Bike 60 min","Important","bike","Zone 2 with 4 x 5 min steady."), w("BJJ","Optional","bjj","Moderate.")],
    Thursday:[w("Swim 1,000–1,200 yd + run 45–50 min","Critical","swim","Add 2–4 x 100 only if 50s calm.")],
    Friday:[w("Lift + optional bike 35 min","Optional","lift","No heavy legs.")],
    Saturday:[w("Long bike 1 hr 45 + brick 15 min","Critical","longbike","Practice drinking while moving.")],
    Sunday:[w("Run 70–75 min + swim 800 yd","Important","run","Easy.")]
  }},
  {week:4, phase:"Checkpoint", goal:"Confirm 1,000 yd swim total and 2 hr ride.", days:{
    Monday:[w("Swim 1,000–1,200 yd","Critical","swim","Controlled repeats."), w("Lift full body","Important","lift","Moderate.")],
    Tuesday:[w("BJJ double light","Optional","bjj","Controlled only.")],
    Wednesday:[w("Bike 45–60 min","Important","bike","Easy/steady."), w("BJJ","Optional","bjj","Technique if tired.")],
    Thursday:[w("Swim 1,200–1,400 yd + run 40–45 min","Critical","swim","No panic; repeat tier if needed.")],
    Friday:[w("Lift or rest","Optional","lift","Avoid soreness.")],
    Saturday:[w("Long bike 2 hr + brick 15 min","Critical","longbike","Fuel: 30–45g/hr.")],
    Sunday:[w("Run 60–70 min + easy swim","Important","run","Cutback run.")]
  }},
  {week:5, phase:"Build", goal:"Start real durability and fueling.", days:{
    Monday:[w("Swim 1,300–1,500 yd","Critical","swim","Aim for repeat 100s."), w("Lift full body","Important","lift","Maintenance.")],
    Tuesday:[w("BJJ double","Optional","bjj","Controlled rolling.")],
    Wednesday:[w("Bike 60–70 min","Important","bike","4 x 6 min steady."), w("BJJ","Optional","bjj","Moderate.")],
    Thursday:[w("Swim 1,500 yd + run 50 min","Critical","swim","Try 3 x 300 or 8 x 100.")],
    Friday:[w("Lift + bike 35–45 min easy","Optional","lift","Skip bike if tired.")],
    Saturday:[w("Long bike 2 hr 15 + brick 15–20 min","Critical","longbike","Fuel: 45–60g/hr.")],
    Sunday:[w("Run 75–80 min + easy swim","Important","run","Easy.")]
  }},
  {week:6, phase:"Build", goal:"Increase long bike and swim volume.", days:{
    Monday:[w("Swim 1,400–1,600 yd","Critical","swim","100s should feel controlled."), w("Lift full body","Important","lift","Maintenance.")],
    Tuesday:[w("BJJ double","Optional","bjj","No war rounds.")],
    Wednesday:[w("Bike 70–75 min","Important","bike","Steady intervals or Zone 2."), w("BJJ","Optional","bjj","Technique if shoulders sore.")],
    Thursday:[w("Swim 1,600–1,800 yd + run 50–55 min","Critical","swim","Build toward 3 x 300.")],
    Friday:[w("Lift or easy bike 40 min","Optional","lift","Only if fresh.")],
    Saturday:[w("Long bike 2 hr 30–45 + brick 20 min","Critical","longbike","Fuel: 45–60g/hr.")],
    Sunday:[w("Run 80–90 min + easy swim","Important","run","Easy.")]
  }},
  {week:7, phase:"Build", goal:"First 3-hour ride. BJJ must stay controlled.", days:{
    Monday:[w("Swim 1,600–1,800 yd","Critical","swim","Use 300 blocks if ready."), w("Lift full body","Important","lift","Maintenance.")],
    Tuesday:[w("BJJ double controlled","Optional","bjj","One class if fatigue high.")],
    Wednesday:[w("Bike 75 min","Important","bike","Zone 2 / light tempo."), w("BJJ","Optional","bjj","Light/moderate.")],
    Thursday:[w("Swim 1,800–2,000 yd + run 45–55 min","Critical","swim","Could be 3 x 300 or 4 x 300.")],
    Friday:[w("Lift + optional bike 30 min","Optional","lift","Very light.")],
    Saturday:[w("Long bike 3 hr + brick 20–25 min","Critical","longbike","Fuel: 60g/hr target.")],
    Sunday:[w("Run 75–85 min + easy swim","Important","run","Controlled.")]
  }},
  {week:8, phase:"Checkpoint", goal:"Cut back and evaluate swim/bike readiness.", days:{
    Monday:[w("Swim 1,400–1,600 yd","Critical","swim","Technique reset."), w("Lift full body","Important","lift","Light/moderate.")],
    Tuesday:[w("BJJ double light","Optional","bjj","Technical only if tired.")],
    Wednesday:[w("Bike 50–60 min","Important","bike","Easy."), w("BJJ","Optional","bjj","Technique.")],
    Thursday:[w("Swim 1,500–1,700 yd + run 40–45 min","Critical","swim","Controlled repeats.")],
    Friday:[w("Lift or rest","Optional","lift","Rest encouraged if beat up.")],
    Saturday:[w("Long bike 2 hr 15 + brick 15 min","Critical","longbike","Cutback but still fuel.")],
    Sunday:[w("Run 65–75 min + easy swim","Important","run","Easy.")]
  }},
  {week:9, phase:"Peak", goal:"Race-specific confidence; open water if possible.", days:{
    Monday:[w("Swim 1,800–2,000 yd","Critical","swim","3 x 500 if ready."), w("Lift light","Optional","lift","Maintenance only.")],
    Tuesday:[w("BJJ double controlled","Optional","bjj","No death rounds.")],
    Wednesday:[w("Bike 75 min","Important","bike","Race-effort blocks."), w("BJJ light","Optional","bjj","Technical only.")],
    Thursday:[w("Swim 2,000–2,300 yd + run 50 min","Critical","swim","Race-distance total is the goal.")],
    Friday:[w("Lift light or rest","Optional","lift","Rest is fine.")],
    Saturday:[w("Long bike 3 hr 30 + brick 25–30 min","Critical","longbike","Fuel: 60–75g/hr. Race setup.")],
    Sunday:[w("Run 90–100 min + easy swim","Important","run","Do not race the run.")]
  }},
  {week:10, phase:"Peak", goal:"Biggest race-specific week.", days:{
    Monday:[w("Swim 1,900–2,200 yd","Critical","swim","3 x 500 or 1,500 continuous attempt."), w("Lift light","Optional","lift","Short maintenance.")],
    Tuesday:[w("BJJ double light/moderate","Optional","bjj","Controlled only.")],
    Wednesday:[w("Bike 60–75 min","Important","bike","Steady, not crushing."), w("BJJ light","Optional","bjj","Technique only.")],
    Thursday:[w("Swim 2,200–2,400 yd + run 45–50 min","Critical","swim","Race-distance total." )],
    Friday:[w("Rest or short lift","Optional","lift","Rest preferred.")],
    Saturday:[w("Long bike 3 hr 45–4 hr + brick 30 min","Critical","longbike","Fuel: 60–90g/hr. Race rehearsal.")],
    Sunday:[w("Run 80–90 min + easy swim","Important","run","Easy only.")]
  }},
  {week:11, phase:"Taper", goal:"Reduce volume and avoid hard BJJ.", days:{
    Monday:[w("Swim 1,500–1,700 yd","Critical","swim","Smooth."), w("Lift light","Optional","lift","Short maintenance.")],
    Tuesday:[w("BJJ technique only","Optional","bjj","No hard rolling.")],
    Wednesday:[w("Bike 60 min","Important","bike","Easy with short pickups."), w("Optional BJJ light","Optional","bjj","Technique only.")],
    Thursday:[w("Swim 1,600–1,800 yd + run 40 min","Critical","swim","Easy/steady.")],
    Friday:[w("Rest","Important","rest","Absorb training.")],
    Saturday:[w("Bike 2.5–3 hr + brick 15 min","Critical","longbike","Final longer rhythm ride.")],
    Sunday:[w("Run 60–70 min + easy swim","Important","run","Easy.")]
  }},
  {week:12, phase:"Race Week", goal:"Stay sharp, rested, and calm.", days:{
    Monday:[w("Swim 1,000–1,200 yd easy","Critical","swim","Smooth only.")],
    Tuesday:[w("Skip BJJ or technique only","Optional","bjj","Best choice: skip.")],
    Wednesday:[w("Bike 40–50 min easy","Important","bike","Light spin.")],
    Thursday:[w("Swim 800–1,000 yd + run 25–35 min","Important","swim","Short and relaxed.")],
    Friday:[w("Rest","Critical","rest","No new work.")],
    Saturday:[w("Short shakeout or rest","Important","rest","Check gear.")],
    Sunday:[w("Race / final prep","Critical","race","Execute calmly.")]
  }}
];
function w(title, priority, type, desc) { return {title, priority, type, desc}; }

const SWIM_LEVELS = [
  ["Calm 25s", "Repeat 25 yd without panic.", "12 x 25 controlled"],
  ["Calm 50s", "Repeat 50 yd with controlled breathing.", "8 x 50 controlled"],
  ["First 100s", "Controlled 100 yd repeats.", "4 x 100 controlled"],
  ["300 blocks", "Build steady 300 yd blocks.", "3 x 300 controlled"],
  ["500 blocks", "Race-useful blocks.", "3 x 500 controlled"],
  ["Pool race-ready", "Pool confidence.", "1,500 continuous or 2,000+ total"],
  ["Open-water ready", "Race-specific calm.", "30–40 min open water calm"]
];

const defaultState = {
  tab:"today", week:1, day:todayName(), feel:null, limiter:null, garmin:null,
  done:{}, swimLevel:1,
  ready:{swim:"red", bike:"red", brick:"red", run:"green", fueling:"red", openwater:"red", bjj:"yellow"},
  logs:[]
};
let state = load();
function load(){ try { return {...defaultState, ...JSON.parse(localStorage.getItem("tri703mobile")||"{}")}; } catch { return {...defaultState}; } }
function save(){ localStorage.setItem("tri703mobile", JSON.stringify(state)); }
function todayName(){ return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];}
function planWeek(){ return PLAN.find(p=>p.week == state.week) || PLAN[0];}
function $(s){ return document.querySelector(s);}
function toast(msg="Saved"){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),900);}
function dayWorkouts(){ const p=planWeek(); return p.days[state.day] ? p.days[state.day] : p.days.Monday; }
function init(){
  $("#weekSelect").innerHTML = PLAN.map(p=>`<option value="${p.week}" ${p.week==state.week?"selected":""}>W${p.week}</option>`).join("");
  $("#weekSelect").onchange = e => {state.week=+e.target.value; save(); render();};
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => {state.tab=b.dataset.tab; save(); render();});
  render();
}
function syncShell(){
  $("#weekSelect").value = state.week;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b.dataset.tab===state.tab));
}
function decision(){
  const feel = state.feel, garmin = state.garmin, lim = state.limiter;
  if (feel==="red") return ["red","Critical only or rest. Skip optional work."];
  if (feel==="yellow") return ["yellow","Use minimum versions. Keep critical swim/bike if possible."];
  if (garmin==="red") return ["yellow","You feel okay but Garmin is red: keep intensity easy."];
  if (lim && lim!=="none") return ["yellow",`Limiter: ${lim}. Use minimums for affected sessions.`];
  if (feel==="green") return ["green","Full plan is reasonable."];
  return ["yellow","Tap Green / Yellow / Red to get an adjusted plan."];
}
function render(){
  syncShell();
  if(state.tab==="today") renderToday();
  if(state.tab==="week") renderWeek();
  if(state.tab==="swim") renderSwim();
  if(state.tab==="ready") renderReady();
}
function renderToday(){
  const p=planWeek(), [dclass,dtext]=decision();
  $("#screen").innerHTML = `
    <div class="stack">
      <section class="card stack">
        <div class="row">
          <div>
            <div class="eyebrow">Week ${p.week} · ${p.phase}</div>
            <h2>${state.day}</h2>
            <p>${p.goal}</p>
          </div>
          <select id="daySelect" style="max-width:140px">${DAYS.map(d=>`<option ${d===state.day?"selected":""}>${d}</option>`).join("")}</select>
        </div>
        <div>
          <h3>How are you today?</h3>
          <div class="seg" style="margin-top:8px;">
            ${choiceBtn("feel","green","Green","green")}
            ${choiceBtn("feel","yellow","Yellow","yellow")}
            ${choiceBtn("feel","red","Red","red")}
          </div>
        </div>
        <details>
          <summary>Optional: add Garmin / limiter</summary>
          <div class="stack" style="margin-top:12px;">
            <div>
              <label>Garmin readiness</label>
              <div class="seg four" style="margin-top:7px;">
                ${choiceBtn("garmin","green","Green","green")}
                ${choiceBtn("garmin","yellow","Yellow","yellow")}
                ${choiceBtn("garmin","red","Red","red")}
                ${choiceBtn("garmin",null,"Skip","")}
              </div>
            </div>
            <div>
              <label>Main limiter</label>
              <div class="seg four" style="margin-top:7px;">
                ${choiceBtn("limiter","none","None","")}
                ${choiceBtn("limiter","shoulders","Shoulders","")}
                ${choiceBtn("limiter","legs","Legs","")}
                ${choiceBtn("limiter","time","Time","")}
              </div>
              <div class="seg two" style="margin-top:8px;">
                ${choiceBtn("limiter","general fatigue","General fatigue","")}
                ${choiceBtn("limiter","neck/back","Neck/back","")}
              </div>
            </div>
          </div>
        </details>
        <div class="soft"><span class="pill status ${dclass}">${dclass.toUpperCase()}</span> <strong>${dtext}</strong></div>
      </section>

      <section class="stack">
        ${dayWorkouts().map((w,i)=>renderWorkout(w,i)).join("")}
      </section>
    </div>
  `;
  $("#daySelect").onchange = e => {state.day=e.target.value; save(); render();};
  bindChoices();
  bindWorkoutActions();
}
function choiceBtn(field,value,label,color){
  const active = state[field]===value || (value===null && !state[field]);
  return `<button class="btn choice ${color||""} ${active?"active":""}" data-field="${field}" data-value="${value===null?"":value}">${label}</button>`;
}
function bindChoices(){
  document.querySelectorAll("[data-field]").forEach(b=> b.onclick = () => {
    const val = b.dataset.value || null;
    state[b.dataset.field] = val;
    save(); render();
  });
}
function keyFor(i){ return `w${state.week}-${state.day}-${i}`;}
function renderWorkout(w,i){
  const key=keyFor(i), done=state.done[key]?.status;
  const affected = adjustment(w);
  return `
    <div class="workout ${done==="done"?"done":""}">
      <div class="row">
        <span class="pill ${w.priority.toLowerCase()}">${w.priority}</span>
        <span class="pill">${w.type}</span>
      </div>
      <div class="wtitle">${w.title}</div>
      <div class="detail">${w.desc}</div>
      ${affected ? `<div class="soft mini" style="margin-top:10px;"><strong>Adjustment:</strong> ${affected}</div>` : ""}
      <div class="seg" style="margin-top:12px;">
        <button class="btn green" data-action="done" data-i="${i}">Done</button>
        <button class="btn yellow" data-action="partial" data-i="${i}">Partial</button>
        <button class="btn red" data-action="skipped" data-i="${i}">Skipped</button>
      </div>
      ${state.done[key] ? postPrompt(w,i) : ""}
    </div>
  `;
}
function adjustment(w){
  if(state.feel==="red" && w.priority!=="Critical") return "Skip today.";
  if(state.feel==="red" && w.priority==="Critical") return "Minimum version only.";
  if(state.feel==="yellow" && w.priority==="Optional") return "Optional: skip or keep technique-only.";
  if(state.garmin==="red" && (w.type==="bike" || w.type==="longbike" || w.type==="run")) return "Keep intensity easy.";
  if(state.limiter==="shoulders" && (w.type==="swim" || w.type==="bjj")) return "Technique-only; no hard pulling/rolling.";
  if(state.limiter==="legs" && (w.type==="bike" || w.type==="longbike" || w.type==="run" || w.type==="bjj")) return "Use minimum / Zone 2.";
  if(state.limiter==="time") return "Use the minimum version.";
  return "";
}
function bindWorkoutActions(){
  document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, key=keyFor(i), w=dayWorkouts()[i];
    state.done[key] = {status:b.dataset.action, type:w.type, title:w.title, ts:new Date().toISOString()};
    save(); toast(); render();
  });
  document.querySelectorAll("[data-post]").forEach(b=>b.onclick=()=>{
    handlePost(b.dataset.post, +b.dataset.i, b.dataset.value);
  });
}
function postPrompt(w,i){
  if(w.type==="swim") return `
    <div class="soft stack" style="margin-top:12px;">
      <strong>Swim check</strong>
      <div class="seg">
        <button class="btn green" data-post="swimfeel" data-i="${i}" data-value="controlled">Controlled</button>
        <button class="btn yellow" data-post="swimfeel" data-i="${i}" data-value="hard">Hard OK</button>
        <button class="btn red" data-post="swimfeel" data-i="${i}" data-value="panic">Panic/bad</button>
      </div>
      <details><summary>Optional longest repeat</summary><div class="seg four" style="margin-top:8px;">${["25","50","100","300","500","continuous"].map(x=>`<button class="btn small" data-post="repeat" data-i="${i}" data-value="${x}">${x}</button>`).join("")}</div></details>
    </div>`;
  if(w.type==="longbike") return `
    <div class="soft stack" style="margin-top:12px;">
      <strong>Long bike check</strong>
      <div class="seg">
        <button class="btn green" data-post="fuel" data-i="${i}" data-value="good">Fuel good</button>
        <button class="btn yellow" data-post="fuel" data-i="${i}" data-value="okay">Fuel okay</button>
        <button class="btn red" data-post="fuel" data-i="${i}" data-value="bad">Fuel bad</button>
      </div>
      <div class="seg two">
        <button class="btn green" data-post="brick" data-i="${i}" data-value="yes">Brick done</button>
        <button class="btn yellow" data-post="brick" data-i="${i}" data-value="no">No brick</button>
      </div>
    </div>`;
  if(w.type==="bjj") return `
    <div class="soft stack" style="margin-top:12px;">
      <strong>BJJ check</strong>
      <div class="seg">
        <button class="btn green" data-post="bjj" data-i="${i}" data-value="light">Light</button>
        <button class="btn yellow" data-post="bjj" data-i="${i}" data-value="moderate">Moderate</button>
        <button class="btn red" data-post="bjj" data-i="${i}" data-value="hard">Hard</button>
      </div>
      <details><summary>Optional damage</summary><div class="seg four" style="margin-top:8px;">${["none","shoulders","legs","neck/back"].map(x=>`<button class="btn small" data-post="damage" data-i="${i}" data-value="${x}">${x}</button>`).join("")}</div></details>
    </div>`;
  return "";
}
function handlePost(type,i,value){
  const key=keyFor(i);
  const obj = state.done[key] || {};
  obj[type]=value; state.done[key]=obj;
  if(type==="swimfeel"){
    if(value==="controlled" && state.swimLevel<7) { state.swimLevel++; toast("Swim level progressed"); }
    if(value==="panic" && state.swimLevel>1) { state.swimLevel--; toast("Swim level reduced"); }
    if(value==="hard") toast("Repeat swim level");
  }
  if(type==="fuel"){
    state.ready.fueling = value==="good" ? "green" : value==="okay" ? "yellow" : "red";
    toast("Fueling updated");
  }
  if(type==="brick"){
    if(value==="yes") state.ready.brick = state.ready.brick==="red" ? "yellow" : "green";
    toast("Brick updated");
  }
  if(type==="bjj"){
    if(value==="hard") { state.feel = state.feel==="green" ? "yellow" : state.feel; state.ready.bjj="yellow"; toast("Tomorrow: reduce intensity"); }
    else toast("BJJ logged");
  }
  if(type==="damage" && value!=="none"){
    state.limiter = value === "neck/back" ? "neck/back" : value;
    state.ready.bjj="yellow";
    toast("Limiter set");
  }
  save(); render();
}
function renderWeek(){
  const p=planWeek();
  const all = Object.values(p.days).flat();
  const critTotal = all.filter(x=>x.priority==="Critical").length;
  const critDone = Object.entries(state.done).filter(([k,v])=>k.startsWith(`w${state.week}-`) && v.status==="done").length;
  $("#screen").innerHTML = `
    <div class="stack">
      <section class="card stack">
        <div class="row"><div><div class="eyebrow">Week ${p.week}</div><h2>${p.phase}</h2><p>${p.goal}</p></div><button class="btn small" id="resetWeek">Reset</button></div>
        <div><div class="row mini"><strong>Completed sessions</strong><span>${critDone}</span></div><div class="meter"><div style="width:${Math.min(100,critDone/all.length*100)}%"></div></div></div>
        <p class="mini">Do not chase 100%. Protect critical swim, long bike, and brick.</p>
      </section>
      ${DAYS.filter(d=>p.days[d]).map(day=>`
        <section class="card stack">
          <h3>${day}</h3>
          ${p.days[day].map((w,i)=> {
            const key=`w${state.week}-${day}-${i}`;
            const s=state.done[key]?.status;
            return `<div class="row soft"><div><span class="pill ${w.priority.toLowerCase()}">${w.priority}</span><div style="margin-top:5px;"><strong>${w.title}</strong></div><div class="mini muted">${w.desc}</div></div><span class="pill">${s||"open"}</span></div>`;
          }).join("")}
        </section>`).join("")}
    </div>`;
  $("#resetWeek").onclick=()=>{ Object.keys(state.done).forEach(k=>{ if(k.startsWith(`w${state.week}-`)) delete state.done[k]; }); save(); render(); };
}
function renderSwim(){
  $("#screen").innerHTML = `
    <div class="stack">
      <section class="card stack">
        <div class="row"><div><div class="eyebrow">Current swim level</div><h2>Level ${state.swimLevel}: ${SWIM_LEVELS[state.swimLevel-1][0]}</h2><p>${SWIM_LEVELS[state.swimLevel-1][1]}</p></div></div>
        <div class="seg">
          <button class="btn green" id="swimUp">Progress</button>
          <button class="btn yellow" id="swimSame">Repeat</button>
          <button class="btn red" id="swimDown">Reduce</button>
        </div>
        <p class="mini">Progress only when breathing is controlled and the set feels like practice, not survival.</p>
      </section>
      ${SWIM_LEVELS.map((l,idx)=>`
        <section class="level ${idx+1===state.swimLevel?"current":""}">
          <div class="row"><strong>Level ${idx+1}: ${l[0]}</strong>${idx+1===state.swimLevel?'<span class="pill">Current</span>':''}</div>
          <p style="margin-top:6px;">${l[1]}</p>
          <div class="soft mini" style="margin-top:8px;"><strong>Unlock:</strong> ${l[2]}</div>
        </section>`).join("")}
      <section class="card stack">
        <h2>Starter sets</h2>
        <div class="soft"><strong>500 yd:</strong> 4x25 warmup, 4x25 drill, 8x25 main, 4x25 cooldown.</div>
        <div class="soft"><strong>800 yd:</strong> 4x25 warmup, 4x25 drill, 8x25, 4x50, 4x25 easy, 4x25 cooldown.</div>
        <div class="soft"><strong>1,500 yd:</strong> 200 warmup, 6x50 drill, 8x100 main, 200 cooldown.</div>
      </section>
    </div>`;
  $("#swimUp").onclick=()=>{ if(state.swimLevel<7) state.swimLevel++; save(); toast("Progressed"); render(); };
  $("#swimSame").onclick=()=>toast("Repeat current level");
  $("#swimDown").onclick=()=>{ if(state.swimLevel>1) state.swimLevel--; save(); toast("Reduced"); render(); };
}
function renderReady(){
  const items = [
    ["swim","Swim","Green: 1,500 yd continuous or 3 x 500 controlled."],
    ["bike","Bike","Green: 3.5–4 hr long ride or roughly 45–55 mi."],
    ["brick","Brick","Green: 25–30 min run off long bike."],
    ["run","Run","Green: 80–100 min easy long run."],
    ["fueling","Fueling","Green: 60g+ carbs/hr practiced."],
    ["openwater","Open water","Green: 1–2 calm open-water swims."],
    ["bjj","BJJ fatigue","Green: no recurring shoulder/neck/knee issue."]
  ];
  const score = Math.round(items.reduce((a,[k])=>a+(state.ready[k]==="green"?2:state.ready[k]==="yellow"?1:0),0)/(items.length*2)*100);
  $("#screen").innerHTML = `
    <div class="stack">
      <section class="card stack">
        <div class="row"><div><div class="eyebrow">Race readiness</div><h2>${score}%</h2><p>Completion is less important than these benchmarks.</p></div></div>
        <div class="meter"><div style="width:${score}%"></div></div>
      </section>
      ${items.map(([k,name,desc])=>`
        <section class="card stack">
          <div class="row"><div><h3>${name}</h3><p class="mini">${desc}</p></div><span class="pill status ${state.ready[k]}">${state.ready[k].toUpperCase()}</span></div>
          <div class="seg">
            ${["red","yellow","green"].map(s=>`<button class="btn ${s} ${state.ready[k]===s?"active":""}" data-ready="${k}" data-value="${s}">${s}</button>`).join("")}
          </div>
        </section>`).join("")}
      <section class="card stack">
        <h2>Checkpoint rules</h2>
        <div class="soft"><strong>Week 4:</strong> 1,000 yd swim total, 2 hr ride, 15 min brick.</div>
        <div class="soft"><strong>Week 8:</strong> 1,500–2,000 yd swim total, 3 hr ride, 75–90 min run.</div>
        <div class="soft"><strong>Week 10:</strong> race-distance swim total, 3.5–4 hr ride, 25–30 min brick, fueling practiced.</div>
      </section>
    </div>`;
  document.querySelectorAll("[data-ready]").forEach(b=>b.onclick=()=>{ state.ready[b.dataset.ready]=b.dataset.value; save(); render();});
}
init();
</script>
</body>
</html>
